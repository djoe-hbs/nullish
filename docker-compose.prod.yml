# Nullish — production stack for the VPS.  Full instructions: deploy/VPS_DEPLOY.md
#
#   internet ──443/80──> web (Caddy: HTTPS, built frontend, /api -> api)
#                          api ── postgres, redis
#                          worker (crawls, embedding queue, scheduled re-crawls)
#   api/worker ──> gpu-tunnel:8001/8002/8003 ──SSH──> GPU server (vLLM: chat, embed, rerank)
#
# Only the web container publishes ports. Database, queue, API and the GPU tunnel are reachable
# only inside the Docker network.
#
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build

name: nullish

x-backend: &backend
  build:
    context: ./backend
  env_file: ${ENV_FILE:-.env}
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nullish}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-nullish}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nullish}"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  # One-shot: applies database migrations, then exits. api/worker start only after it succeeds.
  migrate:
    <<: *backend
    build:
      context: ./backend
      target: api
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *backend
    build:
      context: ./backend
      target: api
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000",
              "--proxy-headers", "--forwarded-allow-ips", "*", "--timeout-keep-alive", "75"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=10)"]
      interval: 15s
      timeout: 12s
      retries: 10
      start_period: 30s

  worker:
    <<: *backend
    build:
      context: ./backend
      target: worker
    command: ["arq", "app.workers.settings.WorkerSettings"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  # Keeps an SSH tunnel to the GPU server open, reconnecting automatically. Exposes the three
  # model servers to the other containers as gpu-tunnel:8001 (chat), :8002 (embed), :8003 (rerank).
  gpu-tunnel:
    build:
      context: ./deploy
      dockerfile: tunnel.Dockerfile
    restart: unless-stopped
    environment:
      GPU_HOST: ${GPU_HOST:?set GPU_HOST in .env}
      GPU_SSH_PORT: ${GPU_SSH_PORT:-22}
      GPU_SSH_USER: ${GPU_SSH_USER:-root}
    volumes:
      - ./deploy/secrets/gpu_ssh_key:/keys/id_ed25519:ro
      - tunnel_known_hosts:/root/.ssh

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env (your domain)}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy_data:/data   # HTTPS certificates: keep this volume
      - caddy_config:/config
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
  tunnel_known_hosts:
