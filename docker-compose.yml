# Smish — local stack (runs on this PC).
# All models (chat/router, embeddings, reranker) run on a rented Vast.ai GPU, reached through one
# SSH tunnel on the host (gpu/tunnel.ps1 -> localhost:8001/8002/8003), which containers see as
# host.docker.internal. Crawling, extraction and chunking run here even while the GPU is off;
# new chunks wait for embedding until it is back.

name: nullish

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nullish}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nullish}
      POSTGRES_DB: ${POSTGRES_DB:-nullish}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:55432:5432"   # host port moved: 5432/5433 already used on this PC
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nullish}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:56379:6379"   # 6379 already used by another project
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # OPTIONAL local CPU models (`docker compose --profile cpu-models up`). Off by default:
  # on this PC's CPU (Ryzen 5 3500U) Qwen3-Embedding-0.6B took ~31 s per 600-token chunk and
  # ~10 min to warm up. Only useful on a much faster CPU.
  tei-embed:
    profiles: ["cpu-models"]
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    command: ["--model-id", "${EMBED_MODEL:-Qwen/Qwen3-Embedding-0.6B}",
              "--max-client-batch-size", "64", "--auto-truncate", "--max-batch-tokens", "4096"]
    mem_limit: 4g
    volumes:
      - hfcache:/data
    ports:
      - "127.0.0.1:8081:80"

  tei-rerank:
    profiles: ["cpu-models"]
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    command: ["--model-id", "${RERANK_MODEL:-BAAI/bge-reranker-v2-m3}",
              "--auto-truncate", "--max-batch-tokens", "4096"]
    mem_limit: 4g
    volumes:
      - hfcache:/data
    ports:
      - "127.0.0.1:8082:80"

  migrate:
    build:
      context: ./backend
      target: api
    env_file: .env
    volumes:
      - ./backend:/app
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build:
      context: ./backend
      target: api
    env_file: .env
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./backend:/app
    ports:
      - "127.0.0.1:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build:
      context: ./backend
      target: worker
    env_file: .env
    command: ["arq", "app.workers.settings.WorkerSettings"]
    volumes:
      - ./backend:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  frontend:
    build: ./frontend
    environment:
      VITE_API_PROXY: http://api:8000
      VITE_POLL: "1"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/index.html:/app/index.html
    ports:
      # Host 3000: Hyper-V reserves 5158-5257 on this PC after restarts (5173 bind fails).
      - "127.0.0.1:3000:5173"
    depends_on:
      - api

  # Sample "shop" databases for developing/testing database connections:
  #   docker compose --profile testdbs up -d testdb-postgres testdb-mysql testdb-mariadb
  # In Smish: host testdb-postgres:5432 (or testdb-mysql / testdb-mariadb :3306), database shop, user shop,
  # password shop. Needs ALLOW_PRIVATE_DB_HOSTS=true (they're on the Docker network).
  testdb-postgres:
    image: postgres:16-alpine
    profiles: ["testdbs"]
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop
    volumes:
      - ./testdbs/postgres-shop.sql:/docker-entrypoint-initdb.d/shop.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 3s
      retries: 20

  testdb-mysql:
    image: mysql:8.4
    profiles: ["testdbs"]
    environment:
      MYSQL_ROOT_PASSWORD: shoproot
      MYSQL_DATABASE: shop
      MYSQL_USER: shop
      MYSQL_PASSWORD: shop
    volumes:
      - ./testdbs/mysql-shop.sql:/docker-entrypoint-initdb.d/shop.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ushop", "-pshop"]
      interval: 3s
      retries: 40

  testdb-mariadb:
    image: mariadb:11.4
    profiles: ["testdbs"]
    environment:
      MARIADB_ROOT_PASSWORD: shoproot
      MARIADB_DATABASE: shop
      MARIADB_USER: shop
      MARIADB_PASSWORD: shop
    volumes:
      - ./testdbs/mysql-shop.sql:/docker-entrypoint-initdb.d/shop.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      retries: 40

volumes:
  pgdata:
  hfcache:
